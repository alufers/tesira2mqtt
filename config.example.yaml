# tesira2mqtt configuration.
#
# ${VAR} references are expanded from the environment, so credentials can stay
# out of the file.

log_level: info # debug | info | warn | error

mqtt:
  broker: tcp://mqtt.local:1883
  client_id: tesira2mqtt # one connection per system, suffixed with the system name
  username: ""
  password: "" # e.g. ${MQTT_PASSWORD}
  prefix: tesira # first topic segment
  qos: 0
  retain: true
  keep_alive: 30s
  connect_timeout: 10s
  insecure_tls: false # skip certificate verification for ssl:// brokers

systems:
  - # Second topic segment. Leave empty to use the DSP's own hostname.
    name: ""

    transport: ssh # ssh | telnet
    host: 10.12.10.104
    port: 22 # defaults to 22 for ssh, 23 for telnet

    # Tesira devices with no password configured accept an empty one over
    # keyboard-interactive, which is the default here.
    username: default
    password: ""

    # Host key checking is off by default: Tesira devices usually live on a
    # closed control network with no pinned key.
    host_key_verification: false
    known_hosts_file: ~/.ssh/known_hosts

    connect_timeout: 10s
    command_timeout: 5s
    reconnect_interval: 5s
    resubscribe_interval: 60s # also refreshes published state

    block_types: [] # allowlist of Tesira block types; empty means all supported
    skip_blocks: [] # instance tags to ignore entirely
